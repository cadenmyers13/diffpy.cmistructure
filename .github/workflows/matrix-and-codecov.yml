name: Matrix and Codecov

on:
  # push:
  #   branches:
  #     - main
  release:
    types:
      - prereleased
      - published
  workflow_dispatch:

jobs:
  matrix-coverage:
    uses: scikit-package/release-scripts/.github/workflows/_matrix-and-codecov-on-merge-to-main.yml@v0
    with:
      project: diffpy.cmistructure
      c_extension: false
      headless: false
      run: |
        set -Eeuo pipefail
        python -m pip install --no-deps diffpy.srfit==3.4.0rc0
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
