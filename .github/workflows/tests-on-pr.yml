name: Tests on PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests-on-pr:
    uses: scikit-package/release-scripts/.github/workflows/_tests-on-pr.yml@v0
    with:
      project: diffpy.cmistructure
      c_extension: false
      headless: false
      run: |
        set -Eeuo pipefail
        python -m pip install --no-deps diffpy.srfit==3.4.0rc0
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
